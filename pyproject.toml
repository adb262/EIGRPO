[project]
name = "eigrpo"
version = "0.1.0"
description = "Effective Information Gain for Sample Efficient Group Policy Optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verl==0.7.0",
    "torch==2.8.0",
    "numpy",
    "omegaconf",
    "hydra-core",
    "wandb",
    "datasets",
    "pandas",
    "pyarrow",
    "truss>=0.15.4",
    "transformers==4.57.6",
    "pyzmq>=27.1.0",
    "vllm>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eigrpo"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

custom_reward_function:
  path: src/eigrpo/environments/reward_dispatch.py
  name: compute_score

algorithm:
  adv_estimator: grpo
data:
  train_batch_size: 16
  max_prompt_length: 1024
  max_response_length: 2048
  val_max_samples: 200
actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-0.5B-Instruct
    enable_gradient_checkpointing: true
    use_remove_padding: true
  rollout:
    n: 64  # group size for GRPO
    name: vllm
    tensor_model_parallel_size: 1  # TP=1 → DP=2 across GPUs (0.5B fits on one GPU)
    log_prob_micro_batch_size: 256
    dtype: bfloat16
    free_cache_engine: false  # keep vLLM's KV cache and CUDA graphs resident across steps
    val_kwargs:
      n: 8
      do_sample: true
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 64
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      model_dtype: bfloat16
  ref:
    log_prob_micro_batch_size: 16
    fsdp_config:
      model_dtype: bfloat16
eigrpo:
  selector:
    name: eig
    n_effective_samples: 8
  diversity:
    log_gradient_norms: false
    log_trajectory_similarity: true
  environment:
    name: gsm8k
    reward_fn: eigrpo.environments.gsm8k_reward.compute_score
  logging:
    rollout_table_freq: 10      # log a wandb table every N steps; 0 = disabled
    rollout_table_max_rows: 32  # legacy field, unused by the selection table
    rollout_table_max_groups: 2 # max prompt groups shown; each contributes G rows

trainer:
  n_gpus_per_node: 2
  nnodes: 1
  total_epochs: 3
  profile_steps: []
  val_before_train: false
  test_freq: 100
  save_freq: 300
  default_hdfs_dir: null
  default_local_dir: ./checkpoints

ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null

transfer_queue:
  enable: false

global_profiler:
  steps: [1, 2, 5]  # Profile at steps 1, 2, and 5; adjust as needed
  save_path: outputs/profile
